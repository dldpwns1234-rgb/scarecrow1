<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 9칸 늘림 패널 '삼베': 가장자리 20px(바느질 테)은 그대로. 목록 카드·설명 칸에 쓴다 -->
  <defs>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#3b3346"/>
      <path d="M0 1.5 H6 M0 4.5 H6" stroke="#463d52" stroke-width="1"/>
      <path d="M1.5 0 V6 M4.5 0 V6" stroke="#332c3d" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="9" fill="#1d1824"/>
  <rect x="4" y="4" width="88" height="88" rx="7" fill="url(#weave)"/>
  <!-- 위쪽 달빛 테두리 빛 -->
  <path d="M10 5.5 H86" stroke="#a99ac4" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <!-- 바느질 테 -->
  <rect x="10" y="10" width="76" height="76" rx="4" fill="none" stroke="#c9b48a" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.75"/>
</svg>
