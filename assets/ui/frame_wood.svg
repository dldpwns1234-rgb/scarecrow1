<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 9칸 늘림 패널 '볏짚 끈 나무판': 가장자리 28px(모서리 못·끈)은 그대로, 가운데는 늘어난다. 달빛 동화 그림책풍 (방장 2026-10-15) -->
  <!-- 바깥 어두운 테 -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#2a1a0e"/>
  <!-- 나무판 -->
  <rect x="5" y="5" width="86" height="86" rx="8" fill="#4e3522"/>
  <!-- 가로 판자 이음 (가운데는 늘어나도 결처럼 보인다) -->
  <path d="M8 34 H88 M8 62 H88" stroke="#3a2618" stroke-width="2"/>
  <path d="M8 36 H88 M8 64 H88" stroke="#62452c" stroke-width="1" opacity="0.6"/>
  <!-- 위쪽 달빛 테두리 빛, 아래쪽 그늘 -->
  <path d="M10 7 H86" stroke="#9f86b8" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  <path d="M10 89 H86" stroke="#1d120a" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <!-- 안쪽 얇은 테 -->
  <rect x="9" y="9" width="78" height="78" rx="5" fill="none" stroke="#6b4a2f" stroke-width="1.5"/>
  <!-- 모서리 못 넷 -->
  <g fill="#c9b48a" stroke="#2a1a0e" stroke-width="1.2">
    <circle cx="15" cy="15" r="3"/>
    <circle cx="81" cy="15" r="3"/>
    <circle cx="15" cy="81" r="3"/>
    <circle cx="81" cy="81" r="3"/>
  </g>
  <!-- 왼쪽 위·오른쪽 위 모서리를 묶은 볏짚 끈 -->
  <g stroke="#2a1a0e" stroke-width="1" fill="#e2c372">
    <path d="M3 20 L20 3 L25 8 L8 25 Z"/>
    <path d="M93 20 L76 3 L71 8 L88 25 Z"/>
  </g>
  <g stroke="#b8913a" stroke-width="1">
    <path d="M7 19 L19 7 M10 22 L22 10"/>
    <path d="M89 19 L77 7 M86 22 L74 10"/>
  </g>
</svg>
